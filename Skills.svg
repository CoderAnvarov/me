<svg width="560" height="440" viewBox="0 0 560 440" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gJS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff700"/>
      <stop offset="100%" stop-color="#ff9d00"/>
    </linearGradient>
    <linearGradient id="gJava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5f00"/>
      <stop offset="100%" stop-color="#ff0066"/>
    </linearGradient>
    <linearGradient id="gPHP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5cff"/>
      <stop offset="100%" stop-color="#c400ff"/>
    </linearGradient>
    <linearGradient id="gHTML" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d3d"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="gCSS" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="gNode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3"/>
      <stop offset="100%" stop-color="#00c46a"/>
    </linearGradient>
    <linearGradient id="gShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="50%" stop-color="#ff00c8"/>
      <stop offset="100%" stop-color="#fff700"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-200%" width="220%" height="500%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-100%" width="140%" height="300%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .label { font-family: 'Segoe UI', Verdana, sans-serif; font-size: 18px; font-weight: 700; fill: #f5f5f5; }
      .pct { font-family: 'Segoe UI', Verdana, sans-serif; font-size: 16px; font-weight: 800; }
      .track { fill: #171723; }
      .title { font-family: 'Segoe UI', Verdana, sans-serif; font-size: 26px; font-weight: 900; fill: url(#titleGrad); text-anchor: middle; }
    </style>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="560" height="440" rx="18" fill="#0d0d16"/>
  <rect x="1" y="1" width="558" height="438" rx="17" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.5"/>

  <text x="280" y="38" class="title" filter="url(#glow)">⚡ SKILLS ⚡</text>

  <!-- JavaScript 10/10 -->
  <g transform="translate(20,60)">
    <text x="0" y="16" class="label">JavaScript</text>
    <text x="500" y="16" class="pct" fill="#fff700" text-anchor="end" filter="url(#glow)">10/10</text>
    <rect x="0" y="26" width="500" height="18" rx="9" class="track"/>
    <clipPath id="clipJS"><rect x="0" y="26" width="500" height="18" rx="9"/></clipPath>
    <rect x="0" y="26" height="18" rx="9" fill="url(#gJS)" filter="url(#softShadow)">
      <animate attributeName="width" values="0;540;500" keyTimes="0;0.75;1" dur="1.6s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1"/>
    </rect>
    <rect x="-140" y="26" width="80" height="18" fill="url(#gShimmer)" clip-path="url(#clipJS)">
      <animate attributeName="x" values="-140;640" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Java 8/10 -->
  <g transform="translate(20,120)">
    <text x="0" y="16" class="label">Java</text>
    <text x="500" y="16" class="pct" fill="#ff5f8a" text-anchor="end" filter="url(#glow)">8/10</text>
    <rect x="0" y="26" width="500" height="18" rx="9" class="track"/>
    <clipPath id="clipJava"><rect x="0" y="26" width="500" height="18" rx="9"/></clipPath>
    <rect x="0" y="26" height="18" rx="9" fill="url(#gJava)" filter="url(#softShadow)">
      <animate attributeName="width" values="0;432;400" keyTimes="0;0.75;1" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1"/>
    </rect>
    <rect x="-140" y="26" width="80" height="18" fill="url(#gShimmer)" clip-path="url(#clipJava)">
      <animate attributeName="x" values="-140;640" dur="2.2s" begin="1.7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- PHP 7/10 -->
  <g transform="translate(20,180)">
    <text x="0" y="16" class="label">PHP</text>
    <text x="500" y="16" class="pct" fill="#c98bff" text-anchor="end" filter="url(#glow)">7/10</text>
    <rect x="0" y="26" width="500" height="18" rx="9" class="track"/>
    <clipPath id="clipPHP"><rect x="0" y="26" width="500" height="18" rx="9"/></clipPath>
    <rect x="0" y="26" height="18" rx="9" fill="url(#gPHP)" filter="url(#softShadow)">
      <animate attributeName="width" values="0;378;350" keyTimes="0;0.75;1" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1"/>
    </rect>
    <rect x="-140" y="26" width="80" height="18" fill="url(#gShimmer)" clip-path="url(#clipPHP)">
      <animate attributeName="x" values="-140;640" dur="2.2s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- HTML 10/10 -->
  <g transform="translate(20,240)">
    <text x="0" y="16" class="label">HTML</text>
    <text x="500" y="16" class="pct" fill="#ff8a5c" text-anchor="end" filter="url(#glow)">10/10</text>
    <rect x="0" y="26" width="500" height="18" rx="9" class="track"/>
    <clipPath id="clipHTML"><rect x="0" y="26" width="500" height="18" rx="9"/></clipPath>
    <rect x="0" y="26" height="18" rx="9" fill="url(#gHTML)" filter="url(#softShadow)">
      <animate attributeName="width" values="0;540;500" keyTimes="0;0.75;1" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1"/>
    </rect>
    <rect x="-140" y="26" width="80" height="18" fill="url(#gShimmer)" clip-path="url(#clipHTML)">
      <animate attributeName="x" values="-140;640" dur="2.2s" begin="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- CSS 10/10 -->
  <g transform="translate(20,300)">
    <text x="0" y="16" class="label">CSS</text>
    <text x="500" y="16" class="pct" fill="#5cc9ff" text-anchor="end" filter="url(#glow)">10/10</text>
    <rect x="0" y="26" width="500" height="18" rx="9" class="track"/>
    <clipPath id="clipCSS"><rect x="0" y="26" width="500" height="18" rx="9"/></clipPath>
    <rect x="0" y="26" height="18" rx="9" fill="url(#gCSS)" filter="url(#softShadow)">
      <animate attributeName="width" values="0;540;500" keyTimes="0;0.75;1" dur="1.6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1"/>
    </rect>
    <rect x="-140" y="26" width="80" height="18" fill="url(#gShimmer)" clip-path="url(#clipCSS)">
      <animate attributeName="x" values="-140;640" dur="2.2s" begin="2.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Node.js 8/10 -->
  <g transform="translate(20,360)">
    <text x="0" y="16" class="label">Node.js</text>
    <text x="500" y="16" class="pct" fill="#5cffb8" text-anchor="end" filter="url(#glow)">8/10</text>
    <rect x="0" y="26" width="500" height="18" rx="9" class="track"/>
    <clipPath id="clipNode"><rect x="0" y="26" width="500" height="18" rx="9"/></clipPath>
    <rect x="0" y="26" height="18" rx="9" fill="url(#gNode)" filter="url(#softShadow)">
      <animate attributeName="width" values="0;432;400" keyTimes="0;0.75;1" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.34 1.56 0.64 1;0.34 1.56 0.64 1"/>
    </rect>
    <rect x="-140" y="26" width="80" height="18" fill="url(#gShimmer)" clip-path="url(#clipNode)">
      <animate attributeName="x" values="-140;640" dur="2.2s" begin="2.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
